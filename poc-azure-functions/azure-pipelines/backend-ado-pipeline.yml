trigger:
  branches:
    include:
      - main
      - release/*
      - features/*
  paths:
    include:
      - src/*
      - azure-pipelines/*

variables:
  # Replace with your actual Azure Resource Manager Service Connection name
  azureSubscription: 'AzureFreeTrialConnection'
  # Replace with the exact name of your Function App in Azure
  functionAppName: 'func-fullstack-poc-dev'
  buildConfiguration: 'Release'
  vmImageName: 'windows-latest'

pool:
  vmImage: 'Default'

steps:
- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x' # Matches your .NET 10 setup

- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet Packages'
  inputs:
    command: 'restore'
    projects: 'src/**/*.csproj'

- task: DotNetCoreCLI@2
  displayName: 'Build the Function App'
  inputs:
    command: 'build'
    projects: 'src/poc.azure.function.app/poc.azure.function.app.csproj'
    arguments: '--configuration $(buildConfiguration)'

- task: DotNetCoreCLI@2
  displayName: 'Run xUnit Tests'
  inputs:
    command: 'test'
    projects: 'src/poc.azure.function.test/poc.azure.function.test.csproj'
    arguments: '--configuration $(buildConfiguration)'

- task: DotNetCoreCLI@2
  displayName: 'Publish the Function App'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: 'src/poc.azure.function.app/poc.azure.function.app.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
    zipAfterPublish: true

- task: AzureFunctionApp@2
  displayName: 'Deploy to Azure Functions'
  inputs:
    connectedServiceNameARM: '$(azureSubscription)'
    appType: 'functionApp'
    appName: '$(functionAppName)'
    package: '$(Build.ArtifactStagingDirectory)/**/*.zip'