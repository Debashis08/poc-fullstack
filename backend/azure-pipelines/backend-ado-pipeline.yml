trigger:
  branches:
    include:
      - main
      - release/*
      - feature/*
  paths:
    include:
      # Updated to reflect the monorepo structure
      - poc-azure-functions/src/*
      - poc-azure-functions/azure-pipelines/*

variables:
  azureSubscription: 'AzureFreeTrialConnection'
  functionAppName: 'func-fullstack-poc-dev'
  buildConfiguration: 'Release'

# Using your local self-hosted agent
pool: 'Default'

steps:
- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet Packages'
  inputs:
    command: 'restore'
    # Updated path
    projects: 'poc-azure-functions/src/**/*.csproj'

- task: DotNetCoreCLI@2
  displayName: 'Build the Function App'
  inputs:
    command: 'build'
    # Updated path
    projects: 'poc-azure-functions/src/poc.azure.function.app/poc.azure.function.app.csproj'
    arguments: '--configuration $(buildConfiguration)'

- task: DotNetCoreCLI@2
  displayName: 'Run xUnit Tests'
  inputs:
    command: 'test'
    # Updated path
    projects: 'poc-azure-functions/src/poc.azure.function.test/poc.azure.function.test.csproj'
    arguments: '--configuration $(buildConfiguration)'

- task: DotNetCoreCLI@2
  displayName: 'Publish the Function App'
  inputs:
    command: 'publish'
    publishWebProjects: false
    # Updated path
    projects: 'poc-azure-functions/src/poc.azure.function.app/poc.azure.function.app.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
    zipAfterPublish: true

- task: AzureFunctionApp@2
  displayName: 'Deploy to Azure Functions'
  inputs:
    connectedServiceNameARM: '$(azureSubscription)'
    appType: 'functionApp'
    appName: '$(functionAppName)'
    package: '$(Build.ArtifactStagingDirectory)/**/*.zip'